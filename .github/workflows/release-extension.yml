name: Package Chrome extension release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build versioned extension ZIP
    runs-on: ubuntu-latest
    environment: extension-release
    steps:
      - name: Require the protected main branch and production origin
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Extension releases must be dispatched from main."
            exit 1
          fi
          if [ -z "$VITE_TALENTFLY_PWA_ORIGIN" ]; then
            echo "::error::Set the TALENTFLY_PWA_ORIGIN variable in the extension-release environment."
            exit 1
          fi
        env:
          VITE_TALENTFLY_PWA_ORIGIN: ${{ vars.TALENTFLY_PWA_ORIGIN }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Test extension
        run: npm run test:extension

      - name: Lint, type-check, and build extension package
        run: |
          npm run lint:extension
          npm run typecheck:extension
          npm run package:extension
        env:
          VITE_TALENTFLY_PWA_ORIGIN: ${{ vars.TALENTFLY_PWA_ORIGIN }}

      - name: Upload versioned ZIP for manual Chrome Web Store submission
        uses: actions/upload-artifact@v4
        with:
          name: talentfly-extension-release
          path: extension/artifacts/*.zip
          if-no-files-found: error
          retention-days: 30
