name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-checks:
    name: ${{ matrix.workspace.name }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - name: Client
            package: '@talentfly/client'
          - name: Extension
            package: '@talentfly/extension'
          - name: Server
            package: '@talentfly/server'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        id: install
        run: npm ci

      - name: Run tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run test --workspace "${{ matrix.workspace.package }}"

      - name: Lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint --workspace "${{ matrix.workspace.package }}"

      - name: Type-check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run typecheck --workspace "${{ matrix.workspace.package }}"

      - name: Build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build --workspace "${{ matrix.workspace.package }}"

  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: workspace-checks
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Build PWA
        run: npm run build:client

      - name: Package extension for CI validation
        env:
          VITE_TALENTFLY_PWA_ORIGIN: https://talentfly-ci.invalid
        run: npm run package:extension

      - name: Upload PWA build
        uses: actions/upload-artifact@v4
        with:
          name: talentfly-pwa-${{ github.sha }}
          path: client/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: talentfly-extension-${{ github.sha }}
          path: extension/artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
